<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Task Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <span class="brand-icon">✓</span>
      <div>
        <h1>TaskFlow</h1>
        <p class="tagline">Stay organized. Get things done.</p>
      </div>
    </div>
    <button id="theme-toggle" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  </header>

  <main class="container">

    <!-- Task counters -->
    <section class="stats" aria-label="Task statistics">
      <div class="stat-card">
        <span class="stat-label">Total</span>
        <span class="stat-value" id="stat-total">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending</span>
        <span class="stat-value" id="stat-pending">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Completed</span>
        <span class="stat-value" id="stat-completed">0</span>
      </div>
    </section>

    <!-- Add task form -->
    <section class="task-input-row">
      <input
        type="text"
        id="task-input"
        placeholder="What needs to be done?"
        aria-label="New task description"
      />
      <button id="add-task-btn" class="btn-primary">Add Task</button>
    </section>

    <!-- Task list -->
    <section class="task-list-section">
      <div class="task-list-header">
        <h2>My Tasks</h2>
        <button id="clear-all-btn" class="btn-danger hidden">Clear All</button>
      </div>

      <ul id="task-list" class="task-list"></ul>

      <div id="empty-state" class="empty-state">
        <p>🎉 You're all caught up!</p>
        <span>Add a task above to get started.</span>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
